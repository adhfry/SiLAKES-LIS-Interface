<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SiLAKES LIS Plus Jakarta Sansface logo">
  <defs>
    <linearGradient id="silakesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2bd3c8"/>
      <stop offset="100%" stop-color="#00857d"/>
    </linearGradient>
  </defs>

  <!-- droplet silhouette (identitas lab/sampel) -->
  <path d="M60 8 C60 8 22 52 22 78 A38 38 0 0 0 98 78 C98 52 60 8 60 8 Z"
