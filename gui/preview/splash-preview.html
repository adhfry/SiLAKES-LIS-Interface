<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>SiLAKES LIS Plus Jakarta Sansface — Splash Preview</title>
<style>
  html, body { margin:0; height:100%; background:#0b1220; }
  body { display:flex; align-items:center; justify-content:center; }

  .splash {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: radial-gradient(circle at 50% 40%, #16213a 0%, #0f172a 60%, #0b1220 100%);
    animation: splashOut 0.5s ease 1.8s forwards;
  }

  .splash-logo {
    width: 96px; height: 96px; opacity: 0; transform: scale(0.72);
    animation: logoIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
    filter: drop-shadow(0 0 18px rgba(59, 130, 246, 0.35));
  }

  .droplet-stroke, .bridge-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.9s ease .35s forwards; }
  .droplet-fill { opacity: 0; animation: fadeIn .6s ease 1.1s forwards; }

  .node { opacity: 0; transform-origin: center; transform-box: fill-box; }
  .node-device { animation: popIn .35s ease .9s forwards; }
  .node-silakes { animation: popIn .35s ease 1.05s forwards; }

  .pulse-dot { opacity: 0; animation: fadeIn .3s ease 1.3s forwards, pulseDot 1s ease 1.5s infinite; }

  .pulse-ring {
    position: absolute; width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid #2bd3c8; opacity: 0; animation: pulseRing 1.4s ease-out 1.5s 2;
  }
  .pulse-ring--delay { animation-delay: 1.9s; }

  .splash-title {
    margin-top: 22px; opacity: 0; transform: translateY(12px);
    font: 700 24px/1.3 'Segoe UI', Plus Jakarta Sans, sans-serif; color: #f8fafc; letter-spacing: 0.2px;
    animation: fadeUp 0.5s ease 1.15s forwards;
  }
  .splash-title span { font-weight: 400; color: #94a3b8; margin-left: 8px; font-size: 16px; }

  .splash-sub {
    opacity: 0; transform: translateY(10px); font: 400 13px 'Segoe UI', Plus Jakarta Sans, sans-serif; color: #64748b;
    animation: fadeUp 0.5s ease 1.35s forwards;
  }

  .splash-progress { width: 180px; height: 3px; background: #1e293b; border-radius: 2px; margin-top: 22px; overflow: hidden; }
  .splash-progress-fill {
    height: 100%; background: linear-gradient(90deg, #2bd3c8, #00857d); width: 0%; border-radius: 2px;
    animation: fillBar 1.2s ease 1.4s forwards;
  }

  .replay {
    position: fixed; bottom: 16px; right: 16px; z-index: 10;
    font: 500 13px Plus Jakarta Sans, sans-serif; color: #cbd5e1; background: #1e293b; border: 1px solid #334155;
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
  }
  .replay:hover { background: #334155; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes logoIn { to { opacity: 1; transform: scale(1); } }
  @keyframes popIn { to { opacity: 1; transform: scale(1); } from { transform: scale(0); } }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  @keyframes fillBar { to { width: 100%; } }
  @keyframes pulseDot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); } }
  @keyframes pulseRing { 0% { opacity: 0.8; transform: scale(0.6); } 100% { opacity: 0; transform: scale(2.6); } }
  @keyframes splashOut { to { opacity: 0; transform: scale(1.03); pointer-events: none; } }
</style>
</head>
<body>
  <button class="replay" onclick="location.reload()">↻ Replay animasi</button>

  <div class="splash" id="splash">
    <svg class="splash-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2bd3c8" />
          <stop offset="100%" stop-color="#00857d" />
        </linearGradient>
      </defs>
      <path class="droplet-fill" d="M60 8 C60 8 22 52 22 78 A38 38 0 0 0 98 78 C98 52 60 8 60 8 Z" fill="url(#splashGrad)" opacity="0.15" />
      <path class="droplet-stroke" d="M60 8 C60 8 22 52 22 78 A38 38 0 0 0 98 78 C98 52 60 8 60 8 Z" fill="none" stroke="url(#splashGrad)" stroke-width="2.5" pathLength="1" />
      <circle class="node node-device" cx="42" cy="72" r="7" fill="#2bd3c8" />
      <circle class="node node-silakes" cx="78" cy="72" r="7" fill="#00857d" />
      <line class="bridge-line" x1="49" y1="72" x2="71" y2="72" stroke="url(#splashGrad)" stroke-width="3" stroke-linecap="round" pathLength="1" />
      <circle class="pulse-dot" cx="60" cy="72" r="3.5" fill="#ffffff" />
    </svg>

    <div class="pulse-ring"></div>
    <div class="pulse-ring pulse-ring--delay"></div>

    <h1 class="splash-title">SiLAKES <span>LIS Plus Jakarta Sansface</span></h1>
    <p class="splash-sub">Menghubungkan MC-200 ⇄ SiLAKES</p>

    <div class="splash-progress"><div class="splash-progress-fill"></div></div>
  </div>
</body>
</html>
